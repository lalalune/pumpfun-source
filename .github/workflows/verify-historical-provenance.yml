name: Verify historical contract provenance
on:
  push:
    paths:
      - 'research/dispatch-evidence-root/**'
      - 'research/amm-recipe-provenance-20261030/**'
      - '.github/workflows/verify-historical-provenance.yml'
  pull_request:
    paths:
      - 'research/dispatch-evidence-root/**'
      - 'research/amm-recipe-provenance-20261030/**'
      - '.github/workflows/verify-historical-provenance.yml'
  workflow_dispatch:
jobs:
  historical-provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # These audits intentionally read historical Git commits. Keep the
          # history, fetching old blobs on demand rather than every old binary.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B research/dispatch-evidence-root/test_verify.py
      - run: python -B research/amm-recipe-provenance-20261030/test_verify.py
