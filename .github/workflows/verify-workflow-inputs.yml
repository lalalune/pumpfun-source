name: Verify workflow script inputs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workflow-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Test the input checker
        # Runs every checker regression suite (scripts/test_workflow_*.py); the
        # count keeps an emptied or renamed suite from passing as zero tests.
        run: |
          python -B - <<'PYTEST'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('scripts', pattern='test_workflow_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          expected = 51
          print(f'Expected {expected} tests; ran {result.testsRun}; skipped {len(result.skipped)}', file=sys.stderr)
          sys.exit(0 if result.wasSuccessful() and result.testsRun == expected and not result.skipped else 1)
          PYTEST
      - name: Check for newly missing script inputs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BASE"
          else
            base=$(git merge-base HEAD origin/main)
          fi
          python -B scripts/check_workflow_inputs.py --base "$base" > workflow-inputs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-inputs
          path: workflow-inputs.json
