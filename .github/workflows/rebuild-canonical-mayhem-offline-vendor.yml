name: Rebuild Mayhem with fixed MSVC and authenticated crate cache

on:
  workflow_dispatch:
    inputs:
      native_inputs_sha256:
        description: 'Reviewed complete MSVC/WinSDK manifest SHA-256; empty means install and preflight only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: canonical-mayhem-offline-vendor
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Preserve exact checkout bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            programs/mayhem
            research/all-contract-completion-20261028
            research/mayhem-fresh-host-20261028
            research/mayhem-pinned-windows-toolchain-20261028
            research/mayhem-offline-vendor-20261028
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.7'
      - name: Install and verify exact fixed compiler cohort
        shell: pwsh
        run: |
          python -I -B research/mayhem-pinned-windows-toolchain-20261028/install.py --output work/mayhem-msvc-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pin full native trees, build fresh host and target, verify exact ELF
        shell: pwsh
        env:
          MAYHEM_NATIVE_INPUTS_SHA256: ${{ inputs.native_inputs_sha256 }}
        run: |
          python -I -B research/mayhem-offline-vendor-20261028/run.py --output work/mayhem-canonical-windows --native-inputs-sha256="$env:MAYHEM_NATIVE_INPUTS_SHA256"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain fixed installer and metadata receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mayhem-msvc-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/mayhem-msvc-install/evidence
          if-no-files-found: error
          retention-days: 30
      - name: Retain actual Mayhem compiler or preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mayhem-canonical-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/mayhem-canonical-windows/evidence
          if-no-files-found: warn
          retention-days: 30
