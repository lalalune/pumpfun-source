name: Verify experiment source and output separation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-tree-separation:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test actual filesystem and CLI boundaries
        run: python -B reconstruction/harness/test_experiment_physical_overlap.py
