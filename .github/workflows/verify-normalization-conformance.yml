name: Verify normalization conformance
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute the normalization conformance regressions
        # The count keeps a renamed, emptied or split test file from passing as zero tests.
        run: |
          python -B - <<'PYTEST'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover(
              'reconstruction/harness', pattern='test_normalization_conformance.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          expected = 4
          print(f'Expected {expected} tests; ran {result.testsRun}; skipped {len(result.skipped)}', file=sys.stderr)
          sys.exit(0 if result.wasSuccessful() and result.testsRun == expected and not result.skipped else 1)
          PYTEST
