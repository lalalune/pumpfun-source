name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
concurrency:
  # On main each revision gets its own group, so a newer push can neither
  # cancel a running main verification nor displace a pending one; GitHub
  # keeps only one pending run per group regardless of cancel-in-progress.
  # Other refs share one group per ref and cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - suite: linux-bootstrap-host-libraries
            commands: |
              python -B reconstruction/toolchain/test_bootstrap_linux.py
          - suite: byte-comparison-input-preservation
            commands: |
              sudo apt-get update
              sudo apt-get install -y llvm
              python -B reconstruction/tooling/byte-comparison-input-preservation/test_verify.py --objdump /usr/bin/llvm-objdump
          - suite: contract-tests
            commands: |
              python -B -m unittest discover -s tests -v
          - suite: fees-exact-source-staging
            commands: |
              python -B research/fees-exact-readme-stage-20261030/test_stage.py
              python -B research/fees-exact-readme-stage-20261030/replay.py --repo . --output work/fees-exact-source-staging
          - suite: fees-linux-rebuild-packet
            commands: |
              python -B research/fees-linux-fresh-rebuild-20261030/test_verify.py
              python -B -O research/fees-linux-fresh-rebuild-20261030/test_verify.py
          - suite: swap-hop-residual-packet
            commands: |
              python -B research/swap-hop-residual-20261030/test_verify.py
              python -B -O research/swap-hop-residual-20261030/test_verify.py
          - suite: analysis-packet-encoding
            commands: |
              python -B research/tooling-analysis-encoding-20261030/test_verify.py
              python -B reconstruction/tooling/roadmap-manifest-members/test_verify.py
              python -B reconstruction/tooling/deep-analysis-output-links/test_verify.py
          - suite: amm-multi-hop-packets
            commands: |
              python -B research/amm-multi-hop-images/test_packets.py
          - suite: fastbuild-staging
            commands: |
              python -I -B tests/test_fastbuild_stage.py
              python -B reconstruction/harness/test_fastbuild_output_race.py
              python -B reconstruction/harness/test_fastbuild_library_name.py
          - suite: admin-cto-call-report
            commands: |
              python -B reconstruction/pump-main/lanes/w12b13-cto-callgraph/test_callseq.py
          - suite: admin-cto-stack-coloring
            commands: |
              python -B reconstruction/pump-main/lanes/w12b12-cto-cpi/test_scmerge.py
          - suite: admin-cto-bfi
            commands: |
              python -B reconstruction/pump-main/lanes/w12a10-cto-optoracle/test_bfi.py
          - suite: admin-frame-diagnostics
            commands: |
              python -B reconstruction/pump-main/lanes/w12a02-cto-iroracle/test_diagnostics.py
          - suite: composition-patch-bytes
            commands: |
              python -B reconstruction/harness/test_integrate_failures.py
              python -B reconstruction/harness/test_integrate_no_build_cli.py
              python -B reconstruction/harness/test_integrate_empty_files.py
              python -B reconstruction/harness/test_integrate_binary_files.py
              python -B reconstruction/harness/test_integrate_source_links.py
              python -B reconstruction/harness/test_integrate_orig_sources.py
              python -I -B tests/test_integrate_patch_bytes.py
              python -I -B reconstruction/harness/test_treediff_links.py
          - suite: offline-cargo-cache
            commands: |
              python -I -B scripts/test_prepare_locked_cargo_home.py
          - suite: evidence
            commands: |
              python -B research/tooling-relocated-data-pointers-20261030/test_pointer_analysis.py
              python scripts/verify_evidence.py
              python -B scripts/test_verify_context_slot_bounds.py
              python -B -O scripts/test_verify_context_slot_bounds.py
              python -I -B reconstruction/verification/retained_multihop_outcomes.py --repo-root .
              python -I -B tests/test_retained_multihop_outcomes.py
              python -I -B tests/test_dispatch_root.py
              python -I -B tests/test_analyze_input_admission.py
              python scripts/test_tooling.py
              python -B scripts/test_pump_diagnostic_audit_coverage.py
              python -B scripts/test_pump_diagnostic_audit_publication.py
              python -B scripts/test_pump_fresh_output_optimized.py
              python -B scripts/test_amm_harness_content_cache.py
              python -B tests/test_amm_pinned_candidate.py
              python -B tests/test_pump_create_nested_pinned_image.py
              python -B tests/test_mayhem_differential_pinned_image.py
              python -B tests/test_aggregate_pinned_image.py
              python -B tests/test_pump_validators_pinned_image.py
              python -B tests/test_create_mayhem_candidate_pair.py
              python -B tests/test_mayhem_trade_normal_python.py
              python -B tests/test_fees_donation_create_pinned_image.py
              python -B tests/test_fees_social_claim_pinned_image.py
              python -B tests/test_fees_donation_crank_pinned_image.py
              python -B tests/test_create_mayhem_normal_python.py
              python -B tests/test_two_curve_optimization_guard.py
              python -O -B tests/test_two_curve_optimization_guard.py
              python -B scripts/test_dispatch_recovery.py
              python -B scripts/test_pump_compare_window_alignment.py
              python -B scripts/test_pump_compare_window_columns.py
              python -B scripts/test_pump_exact_body_inventory_columns.py
              python -I -B scripts/test_pump_exact_body_inventory_snapshot.py
              python -B reconstruction/tooling/parallel-input-preservation-20261030/test_input_preservation.py
              python -B reconstruction/tooling/serial-input-preservation-20261030/test_serial_admission.py
              python -B scripts/test_pump_compare_window_strict_csv.py
              python -B scripts/test_replay_macos_frontier_optimization.py
              python -B scripts/test_pump_macos_frontier_qualification_optimization.py
              python -B scripts/test_admin_cto_optimization.py
              python -B scripts/test_build_token_dependency_optimization.py
              python -B scripts/test_revalidate_empty_manifest.py
              python -B scripts/test_measure_relay13_v148_optimization.py
              python -B scripts/test_fees_withdraw_runtime_optimization.py
              python -B scripts/test_measure_relay_v148_optimization.py
              python -B tests/test_verify_dependencies_optimization.py
              python -B tests/test_recovered_builds_optimization.py
              python -B scripts/test_mayhem_burn_sequence_optimization.py
              python -B scripts/test_rebuild_workflow_action_pins.py
              python -B scripts/test_macos_v144_qualification_optimization.py
              python -B scripts/test_mayhem_initialize_state_optimization.py
              python -B scripts/test_fees_crank_probe_optimization.py
              python -B scripts/test_surfpool_truncated_events.py
              python -B scripts/test_constant_product_range_pinning.py
              python -B scripts/test_pump_build_constant_product_binding.py
              python -B scripts/test_fees_validate_all_optimization.py
              python -B scripts/test_claim_differentials_optimization.py
              python -B scripts/test_differentials_optimization.py
              python -B scripts/test_fees_error_messages_precondition.py
              python -B scripts/test_validate_fee_handlers_optimized_exit.py
              python -B scripts/test_fees_external_codec_optimized_mode.py
              python -B scripts/test_pump_validate_volume_encoding.py
              python -B scripts/test_current673_macos_optimized_mode.py
              python -B scripts/test_pump_differential_optimized_mode.py
              python -B scripts/test_pump_validate_constant_product_optimization.py
              python -B scripts/test_pump_with_captured_loader_paths.py
              python -B tests/test_fees_external_codec_pinned_image.py
              python -B scripts/test_pump_validate_parallel.py
              python -B scripts/test_pump_validate_volume_optimization.py
              python -B scripts/test_pump_validate_sell_accounting_optimization.py
              python -B scripts/test_imported_lab_optimization.py
              python -B scripts/test_deep_section_analysis_publication.py
              python -B scripts/test_pump_data_order_publication.py
              python -B scripts/test_deep_disassembly_syscall_usage.py
              python -B scripts/test_disassemble_output_mode.py
              python -B scripts/test_disassemble_tool_binding.py
              python -B scripts/test_analyze_publication.py
              python -B scripts/test_verify_imported_lab_publication.py
              python -B scripts/test_pump_compare_function_bytes_report.py
              python -B scripts/test_sbpf_disassembly_roundtrip_build_log.py
              python -B scripts/test_supported_sbpf_package_paths.py
              python -B scripts/test_pump_quote_control_function_match_output.py
              python -B reconstruction/toolchain/test_dependency_cache.py
              python -B reconstruction/mayhem/native-linux-qualification/test_vendor_membership.py
              python -B scripts/test_analyze_program_publication.py
              python -B scripts/test_reconstruction_roadmap_publication.py
              python -B scripts/test_bytecode_signatures_publication.py
              python -B scripts/test_bytecode_signatures_atomic_publication.py
              python -B scripts/test_revalidate_all_publication.py
              python -B scripts/test_donation_relay_oracle_optimization.py
              python -B tests/test_claim_token_incentives_pinned_image.py
              python -B -X utf8 tests/test_dispatch_idl_encoding.py
              python -B tests/test_local_validation_idl_encoding.py
              python -B tests/test_claim_token_incentives_idl_encoding.py
              python -B tests/test_claim_token_incentives_8099_idl_encoding.py
              python -B tests/test_function_body_file_ranges.py
              python -O -B tests/test_function_body_file_ranges.py
              python -B reconstruction/harness/test_treediff_line_boundaries.py
              python -B reconstruction/harness/test_score_inputs.py
              python -B reconstruction/harness/test_score_empty_baseline.py
              python -B reconstruction/harness/test_score_baseline_option_conflict.py
              python -B reconstruction/harness/test_score_symbol_admission.py
              python -B reconstruction/pump-main/test_ledger_negative_limit.py
              python -B reconstruction/diagnostics/census-portability/test_output_guard.py
              python -B reconstruction/harness/test_experiment_declared_name.py
              python -B reconstruction/harness/test_experiment_worktree_source.py
              python -B reconstruction/harness/test_experiment_matrix_overlap.py
              python -B reconstruction/harness/test_bisect_membership.py
