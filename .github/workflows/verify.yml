name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled on every ref except main, so each published
  # main revision keeps one complete hosted verification.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - suite: amm-prepare-pool-recovery
            commands: |
              python -I -B research/amm-prepare-pool-recovery/verify.py
          - suite: amm-buy-reserve-order
            commands: |
              python -I -B research/amm-buy-reserve-order/verify.py
          - suite: amm-quote-base-recovery
            commands: |
              python -I -B research/amm-quote-base-recovery/verify.py
          - suite: amm-recipient-mode-recovery
            commands: |
              python -I -B research/amm-recipient-mode-recovery/verify.py
          - suite: amm-mint-fee-reader-recovery
            commands: |
              python -I -B research/amm-mint-fee-reader-recovery/verify.py
          - suite: pump-feeconfig-decoder
            commands: |
              python -I -B research/pump-feeconfig-decoder-recovery/verify.py
          - suite: mayhem-clean-linux-evidence
            commands: |
              python -B research/mayhem-clean-linux-build-20261027/verify.py
              python -O -B research/mayhem-clean-linux-build-20261027/verify.py
          - suite: mayhem-native-current432
            commands: |
              python -B research/mayhem-cpi-abort-proof/verify.py
              python -B research/mayhem-cpi-abort-proof/test_verify.py
              python -B research/mayhem-fee-net-accounting/verify.py
              python -B research/mayhem-fee-net-accounting/test_verify.py
              python -I -B research/mayhem-native-current432-composition/verify.py
              python -I -B research/mayhem-native-current432-composition/test_verify.py
              python -B research/mayhem-allocator-call-closure/verify.py
              python -B research/mayhem-allocator-call-closure/test_verify.py
          - suite: mayhem-signer-seed-order
            commands: |
              python -I -B research/mayhem-signer-seed-order/verify.py
              python -I -B research/mayhem-signer-seed-order/test_verify.py
          - suite: mayhem-amm-shape-controls
            commands: |
              python -B research/mayhem-amm-handler-shape-controls-20261027/verify.py
              python -B research/mayhem-amm-handler-shape-controls-20261027/test_verify.py
              python -B research/mayhem-direct-call-closure-20261027/verify.py
              python -B research/mayhem-direct-call-closure-20261027/test_verify.py
              python -O -B research/mayhem-direct-call-closure-20261027/test_verify.py
              python -B research/mayhem-direct-call-closure-20261027/portable_followup.py
              python -O -B research/mayhem-direct-call-closure-20261027/portable_followup.py
              python -B research/mayhem-sweep-admin-attribution-20261027/verify.py
              python -B research/mayhem-sweep-admin-attribution-20261027/test_verify.py
              python -O -B research/mayhem-sweep-admin-attribution-20261027/test_verify.py
          - suite: mayhem-current-quotes
            commands: |
              python -B research/mayhem-quotes-current-recovery-20261027/verify.py
              python -B research/mayhem-quotes-current-recovery-20261027/test_verify.py
          - suite: mayhem-current-sell
            commands: |
              python -B research/mayhem-sell-current-recovery-20261027/verify.py
              python -B research/mayhem-sell-current-recovery-20261027/test_verify.py
