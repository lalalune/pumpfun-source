name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
concurrency:
  # On main each revision gets its own group, so a newer push can neither
  # cancel a running main verification nor displace a pending one; GitHub
  # keeps only one pending run per group regardless of cancel-in-progress.
  # Other refs share one group per ref and cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - suite: analysis-packet-encoding
            commands: |
              python -B research/tooling-analysis-encoding-20261030/test_verify.py
          - suite: composition-patch-bytes
            commands: |
          - suite: fastbuild-staging
            commands: |
              python -I -B tests/test_fastbuild_stage.py
          - suite: composition-patch-bytes
            commands: |
              python -B reconstruction/harness/test_integrate_failures.py
              python -I -B tests/test_integrate_patch_bytes.py
          - suite: pump-claim-v2-account-boundaries
            commands: |
              python -I -B research/pump-claim-v2-account-boundaries/verify.py
              python -I -B research/pump-claim-v2-account-boundaries/mutation_controls.py
          - suite: mayhem-canonical-exact
            commands: |
              python -O -B scripts/verify_current_checkpoint.py mayhem
              python -O -B research/mayhem-canonical-promotion-20261028/test_verify.py
          - suite: pump-multi-hop-quote-admission
            commands: |
              python -I -B research/pump-multi-hop-quote-admission/verify.py
              python -I -B research/pump-multi-hop-quote-admission/test_controls.py
          - suite: pump-canonical-frontier
            commands: |
              python -B scripts/verify_current_checkpoint.py pump
              python -O -B scripts/test_pump_strict_ordered_logs.py
              python -B research/pump-program-creator-notice-qualification-20261028/replay_focused.py --candidate research/pump-program-creator-notice-qualification-20261028/artifacts/candidate.so --output work/pump-canonical-focused
              python -B research/pump-program-creator-notice-qualification-20261028/verify_focused.py --candidate research/pump-program-creator-notice-qualification-20261028/artifacts/candidate.so --reports work/pump-canonical-focused
              python -B research/pump-program-creator-notice-qualification-20261028/replay_captured_create.py --candidate research/pump-program-creator-notice-qualification-20261028/artifacts/candidate.so --output work/pump-captured-create
              python -B scripts/pump_verify_program_creator_captured_create.py --candidate research/pump-program-creator-notice-qualification-20261028/artifacts/candidate.so --runtime-directory work/pump-captured-create
          - suite: pump-program-creator-notice
            commands: |
              python -B research/pump-multihop-accrual-qualification-20261028/verify.py
              python -B research/pump-program-creator-notice-qualification-20261028/verify.py
              python -B research/pump-program-creator-notice-qualification-20261028/integrity_controls.py --report work/pump-program-creator-notice-controls.json
          - suite: relay-current-repeat
            commands: |
              python -O -B research/relay-current-repeat-20261028/verify.py --repo .
