              python scripts/verify_mayhem_sell.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --receipts work/mayhem-sell.json --output work/mayhem-sell-verification.json
              python scripts/mayhem_sell_v2_differential.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --cases repro/mayhem/twentyone/sell-v2-cases.json --family native --output work/mayhem-sell-v2-native.json
              python scripts/verify_mayhem_sell_v2.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --receipts work/mayhem-sell-v2-native.json --output work/mayhem-sell-v2-native-verification.json
              python scripts/mayhem_buy_v2_differential.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --cases repro/mayhem/twentytwo/buy-v2-cases.json --family native --output work/mayhem-buy-v2-native.json
              python scripts/verify_mayhem_buy_v2.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --receipts work/mayhem-buy-v2-native.json --output work/mayhem-buy-v2-native-verification.json
              python scripts/mayhem_buy_v2_differential.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --cases repro/mayhem/twentytwo/buy-v2-cases.json --family token --output work/mayhem-buy-v2-token.json
              python scripts/verify_mayhem_buy_v2.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --receipts work/mayhem-buy-v2-token.json --output work/mayhem-buy-v2-token-verification.json
              python scripts/mayhem_pump_swap_differential.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --cases repro/mayhem/twentyfour/buy-pump-swap-cases.json --instruction buy_pump_swap --family native --output work/mayhem-buy-pump-swap-native.json
              python scripts/verify_mayhem_pump_swap.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --receipts work/mayhem-buy-pump-swap-native.json --output work/mayhem-buy-pump-swap-native-verification.json
              python scripts/mayhem_pump_swap_differential.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --cases repro/mayhem/twentyfour/sell-pump-swap-cases.json --instruction sell_pump_swap --family native --output work/mayhem-sell-pump-swap-native.json
              python scripts/verify_mayhem_pump_swap.py --candidate repro/mayhem/initializer-current-20261027/candidate.so --receipts work/mayhem-sell-pump-swap-native.json --output work/mayhem-sell-pump-swap-native-verification.json
          - suite: imported-lab
            commands: |
              git clone https://github.com/pump-fun/pump-public-docs.git work/pump-public-docs
              python scripts/verify_imported_lab.py --docs-checkout work/pump-public-docs --output work/lab-saved-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdir -p work
      - name: Run bounded validation suites
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.suite }}
          path: |
            work/*.json
            work/*.json.gz
            work/mayhem-burn-replay/**
            work/pump-amm-current-replay/**
          if-no-files-found: ignore

