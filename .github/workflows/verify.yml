              python -B scripts/test_prepare_fees_withdraw_runtime_publication.py
              python -B scripts/test_current673_macos_archive_publication.py
              python -B scripts/test_pump_strict_ordered_logs_output.py
              python -B reconstruction/harness/test_experiment_post_run_errors.py
              python -B reconstruction/harness/test_experiment_root_target.py
              python -B reconstruction/harness/test_coords_cli_admission.py
              python -B reconstruction/harness/test_report_scorer_inputs.py
              python -B reconstruction/harness/test_match_oracle.py
              python -B reconstruction/harness/test_score_atomic_report.py
              python -B reconstruction/harness/test_coords_report_destination.py
              python -B reconstruction/harness/test_short_window_ranking.py
              python -B reconstruction/harness/test_applicability_evidence_paths.py
              python -B reconstruction/harness/test_diagnostic_range_boundaries.py
              python -B reconstruction/harness/test_stack_access_isa.py
              python scripts/test_build_source_manifest.py
              python -B scripts/test_build_fee_selection_binding.py
              python -B scripts/test_build_quote_fees_binding.py
              python -I -B tests/test_manifest_nested_target.py
              python scripts/test_core_linux_v144_retention.py
              # Two of three tests: the third compares against a frozen helper that was removed with repro/;
              # see .github/retired-workflows/2026-10-29-verify-matrix.md.
              python scripts/test_reconstruction_build_selection.py ResearchSelectionTests.test_default_does_not_select_header_incompatible_older_family ResearchSelectionTests.test_explicit_experiment_and_argument_boundaries_are_preserved
              python scripts/test_reconstruction_identity_audit.py
              python scripts/local_validation.py
              python -B research/tooling-interior-string-references-20261030/test_verify.py
              python -I -B scripts/test_verify_evidence_paths.py
              python research/tooling-disassembly-reproducibility-20261030/test_verify.py
              python -B tests/test_dependency_cache_manifest_state.py
              python -B research/tooling-indirect-call-decoding-20261030/test_verify.py
              python -B tests/test_checkpoint_manifest_paths.py
          - suite: runtime-input-regressions
            commands: |
              python -B scripts/test_admin_token_incentives_verify_encoding.py
              python -B scripts/test_pump_v3_configured_fee_surfpool_encoding.py
              python -B scripts/test_pump_migrate_v2_surfpool_encoding.py
              python -B scripts/test_pump_migrate_surfpool_encoding.py
              python -B scripts/test_pump_holder_distribution_surfpool_encoding.py
              python -B scripts/test_pump_exact_quote_surfpool_encoding.py
              python -B scripts/test_pump_fee_sweep_encoding.py
              python -B scripts/test_pump_creator_collect_encoding.py
              python -B scripts/test_pump_surfpool_optimized_mode.py
          # Packets that pin the digest of a reviewed tool snapshot or of its output. They fail
          # by design when the bound tool changes, until the packet is re-reviewed and re-bound;
          # kept apart so a stale binding does not stop the rest of the evidence suite.
          - suite: archived-tool-bindings
            commands: |
              python -B research/tooling-arithmetic-shift-counts-20261030/test_verify.py
              python -B research/tooling-revalidation-manifests-20261030/test_verify.py
              python -B research/tooling-revalidation-invocation-20261030/test_verify.py
              python -B reconstruction/tooling/revalidation-qualification/test_audit.py
              python -B reconstruction/tooling/revalidation-qualification/test_capture_memory.py
              python -B -m unittest discover -s reconstruction/tooling/revalidation-qualification -p 'test_packet_root_links.py'
              python -B -m unittest discover -s reconstruction/tooling/revalidation-qualification -p 'test_packet_identity_stability.py'
              python -B reconstruction/relocation-text-addresses/test_analyze.py
              python -B reconstruction/math-register-comparisons/test_analyze.py
              python research/tooling-terminal-error-patterns-20261030/test_verify.py
              python research/tooling-terminal-error-patterns-20261030/verify.py
              python research/tooling-token-program-constant-detector-20261029/verify.py
              python -B research/tooling-token-program-constant-detector-20261029/test_verify.py
              python -B -m unittest discover -s reconstruction/capture-rpc-retry -p 'test_*.py'
              python -B reconstruction/verification/donation-relay-idl-lifecycle/test_lifecycle.py
              python -B reconstruction/verification/donation-relay-idl-lifecycle/test_verify_steps.py
              python -B reconstruction/verification/donation-relay-stateful/test_stateful.py
              python -B reconstruction/verification/pump-migration-lifecycle/test_lifecycle.py
              python -B reconstruction/verification/mayhem-dispatch-boundaries/test_inventory.py
              python -B reconstruction/verification/mayhem-dispatch-boundaries/test_producer.py
          - suite: host-fragments
            commands: |
              python -B -m unittest discover -s tests -p 'test_global_*_captured.py' -v
              python -B scripts/test_fee_host_validation.py
              python -B tests/test_recovered_curve_arithmetic.py
              mkdir -p work && rustc --edition 2021 -O programs/pump-fees/recovered/fee_selection_host.rs -o work/fee-selector-host
              python scripts/validate_fee_selection.py --host work/fee-selector-host --output work/fee-selector-validation.json
              python scripts/build_quote_host.py --output work/quote-host
              python scripts/validate_quote_fees.py --host work/quote-host/quote-fees-host --output work/quote-validation.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdir -p work
      - name: Run bounded validation suites
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.suite }}
          path: |
            work/*.json
            work/*.json.gz
          if-no-files-found: ignore
