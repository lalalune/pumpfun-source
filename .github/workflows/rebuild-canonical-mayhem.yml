name: Rebuild current Mayhem source on exact Windows toolchain

on:
  workflow_dispatch:
    inputs:
      native_inputs_sha256:
        description: 'Full MSVC/WinSDK manifest SHA-256 from a reviewed preflight artifact; leave empty for preflight discovery'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: canonical-mayhem-windows
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Preserve the pinned source bytes on Windows checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            programs/mayhem
            research/all-contract-completion-20261028
            research/mayhem-fresh-host-20261028
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.7'
      - name: Prepare pinned inputs, compile fresh host macro and target, compare exact ELF
        shell: pwsh
        env:
          MAYHEM_NATIVE_INPUTS_SHA256: ${{ inputs.native_inputs_sha256 }}
        run: |
          python -I -B research/all-contract-completion-20261028/run_mayhem_windows.py --output work/mayhem-canonical-windows --native-inputs-sha256="$env:MAYHEM_NATIVE_INPUTS_SHA256"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain this run's receipts, failures and fresh compiler outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mayhem-canonical-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/mayhem-canonical-windows/evidence
          if-no-files-found: error
          retention-days: 30
